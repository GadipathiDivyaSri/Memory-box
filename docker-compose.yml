version: '3.8'

services:
  # 1. FastAPI Backend (Hidden behind reverse proxy, exposed internally on 8000)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memorybox-backend
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - GEMINI_MODEL=gemini-1.5-flash
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - memorybox-net

  # 2. Streamlit Frontend (Hidden behind reverse proxy, exposed internally on 8501)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: memorybox-frontend
    environment:
      - API_BASE=http://backend:8000/api
    expose:
      - "8501"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - memorybox-net

  # 3. Nginx Reverse Proxy (The ONLY service exposed to the host / outside world on port 8080)
  proxy:
    image: nginx:alpine
    container_name: memorybox-proxy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - memorybox-net

networks:
  memorybox-net:
    driver: bridge
